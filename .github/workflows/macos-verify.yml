name: macos-verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify instruction bytes, fixups, and SDK tools
        run: |
          mkdir -p artifacts
          python3 tools/verify_macos.py | tee artifacts/macos-verify.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-verify-log
          path: artifacts/macos-verify.txt
